name: Test FedRAMP Schema Watch

on:
  # The tests cross-check the watch against README.md's $schema and the publish
  # workflow's SCHEMA_URL, so changes to any of them must run the suite.
  pull_request:
    paths:
      - scripts/check_fedramp_schema_changelog.py
      - tests/**
      - README.md
      - .github/workflows/watch-fedramp-schema-changelog.yml
      - .github/workflows/publish-fedramp-certification-package-overview.yml
      - .github/workflows/test-schema-watch.yml
  push:
    branches:
      - main
    paths:
      - scripts/check_fedramp_schema_changelog.py
      - tests/**
      - README.md
      - .github/workflows/watch-fedramp-schema-changelog.yml
      - .github/workflows/publish-fedramp-certification-package-overview.yml
      - .github/workflows/test-schema-watch.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and BDD tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install BDD runner
        run: python -m pip install --disable-pip-version-check behave==1.3.3

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: BDD acceptance tests (Gherkin)
        run: python -m behave tests/features
