name: Watch FedRAMP Schema CHANGELOG

on:
  schedule:
    # Daily at 13:15 UTC (06:15 Pacific).
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report matching CHANGELOG entries without filing issues
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

env:
  # fnmatch glob applied to the schema file named in each CHANGELOG heading. The
  # trailing * also matches a dated successor file (e.g. ...-schema-2027-01-01.json),
  # not just new versions of the file validated against today.
  SCHEMA_FILE_PATTERN: fedramp-certification-package-overview-schema*
  # CHANGELOG entries dated before this are ignored. Baseline: the repository's JSON
  # was verified valid against 0.1.6 (CHANGELOG entry dated 2026-09-23).
  WATCH_SINCE: "2026-09-24"
  ISSUE_LABEL: fedramp-schema-watch
  ISSUE_ASSIGNEE: sunstonesecure-robert
  PUBLISH_WORKFLOW_NAME: Publish FedRAMP Certification Package Overview
  # Its SCHEMA_URL names the schema file validated against today; the watch reads it
  # from here so there is a single place to update when moving to a successor.
  PUBLISH_WORKFLOW_FILE: .github/workflows/publish-fedramp-certification-package-overview.yml

jobs:
  watch:
    name: Check CHANGELOG and file issues
    runs-on: ubuntu-latest
    concurrency:
      group: fedramp-schema-watch
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Check FedRAMP schemas CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          python scripts/check_fedramp_schema_changelog.py \
            --repo "$GITHUB_REPOSITORY" \
            $DRY_RUN
